name: CodeQL security analysis

on:
  push:
    branches: ["main", "opencode-resume/f0e1f0cc4533ef13c3ab", "feature/live-chelny-prices"]
  pull_request:
    branches: ["main", "opencode-resume/f0e1f0cc4533ef13c3ab"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python", "java-kotlin"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java for Android build
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        if: matrix.language == 'java-kotlin'
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build Android app for CodeQL extraction
        if: matrix.language == 'java-kotlin'
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle -p ChelnyPhones :app:assembleDebug

      - uses: github/codeql-action/analyze@v3
