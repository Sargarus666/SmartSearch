name: AI catalog quality audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only AI audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/ai_catalog_auditor.py
      - name: Upload audit report
        if: hashFiles('ai-catalog-audit.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: smartscan-ai-catalog-audit
          path: ai-catalog-audit.md
          retention-days: 30
