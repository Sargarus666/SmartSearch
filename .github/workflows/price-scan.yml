name: Refresh smartphone prices

on:
  push:
    branches: [main]
    paths: [".github/workflows/price-scan.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartphone-price-refresh
  cancel-in-progress: false

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out scanner branch
        uses: actions/checkout@v4
        with:
          ref: v2.2-firecrawl-price-scanner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-price-scan.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-price-scan.txt

      - name: Scan retailer prices with Firecrawl
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scripts/scan_prices.py

      - name: Commit updated catalogue
        run: |
          if git diff --quiet -- data/phones.json; then
            echo "No catalogue changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phones.json
          git commit -m "chore: refresh verified smartphone prices"
          git push origin HEAD:refs/heads/v2.2-firecrawl-price-scanner
