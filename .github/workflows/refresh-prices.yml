name: Refresh Chelny smartphone prices

on:
  push:
    branches: [feature/live-chelny-prices]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartscan-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape city offers through Firecrawl
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scripts/scrape_firecrawl_prices.py
      - name: Merge authorized merchant feeds when configured
        env:
          SMARTSCAN_FEED_URLS: ${{ vars.SMARTSCAN_FEED_URLS }}
        run: python scripts/update_catalog.py
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Commit changed catalog
        run: |
          if git diff --quiet -- data/phones.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phones.json
          git commit -m "chore: scrape retailer prices for Chelny SmartScan"
          git push
